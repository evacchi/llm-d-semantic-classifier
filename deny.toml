[graph]
all-features = true

[advisories]
unmaintained = "all"
maximum-db-staleness = "P30D"
ignore = [
    # paste is an unmaintained transitive dependency of gemm; RustSec reports
    # that no safe upgrade is available.
    { id = "RUSTSEC-2024-0436", reason = "transitive via gemm; no safe upstream replacement is available" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
