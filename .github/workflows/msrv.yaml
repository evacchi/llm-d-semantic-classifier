name: msrv
on:
  push:
    branches: ["agent/**", "main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: install Rust 1.92.0
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: install protobuf compiler
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      - name: test at the declared MSRV
        run: cargo +1.92.0 test --locked --all-features
