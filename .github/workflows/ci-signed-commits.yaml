name: Check Signed Commits in PR

on:
  pull_request_target:
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  check-signed-commits:
    name: Check signed commits in PR
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check signed commits in PR
        uses: 1Password/check-signed-commits-action@v1
        with:
          comment: |
            🚨 Unsigned commits detected! Please sign your commits.

            Sign commits with `git commit -s` and see [CONTRIBUTING.md](https://github.com/llm-d-incubation/llm-d-semantic-classifier/blob/main/CONTRIBUTING.md) for DCO instructions.

  dco-check:
    name: dco-check
    if: |
      github.event_name == 'merge_group' ||
      (
        github.event_name == 'pull_request_target' &&
        !contains(fromJSON('["dependabot[bot]"]'), github.event.pull_request.user.login)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by trailer matches commit author email (DCO)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
            head="${{ github.event.merge_group.head_sha }}"
          else
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          fi
          # Dependabot signs commits using its bot name rather than the author email.
          bot_allowlist="dependabot[bot]"

          fail=0
          for c in $(git rev-list "$base..$head"); do
            author_name=$(git show -s --format='%an' "$c")
            author_email=$(git show -s --format='%ae' "$c")
            trailers=$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$c")
            if [ -z "$trailers" ]; then
              echo "::error::commit $c is missing a Signed-off-by trailer (author email: $author_email)"
              fail=1
              continue
            fi
            match=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                *"<$author_email>"*) match=1 ;;
              esac
              case " $bot_allowlist " in
                *" $author_name "*)
                  case "$line" in
                    "$author_name "*) match=1 ;;
                  esac
                  ;;
              esac
            done <<<"$trailers"
            if [ "$match" -ne 1 ]; then
              echo "::error::commit $c Signed-off-by email does not match commit author email. expected: $author_email, found: $trailers"
              fail=1
            fi
          done
          exit $fail
